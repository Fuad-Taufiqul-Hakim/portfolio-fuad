<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Fuad Taufiqul Hakim — Neuroscience Researcher & Biotechnologist</title>
    <meta
      name="description"
      content="Portfolio of Fuad Taufiqul Hakim — graduate researcher at the Medical College of Wisconsin studying CNS immunity and brain regeneration, with a background in biotechnology, drug design and computational biology."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fuad Taufiqul Hakim — Neuroscience Researcher & Biotechnologist" />
    <meta
      property="og:description"
      content="Neuroscience research at MCW on immunity and regeneration in the living brain, plus a background in drug design, molecular dynamics and bioinformatics."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
